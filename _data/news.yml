- date: "2022-08"
  text: 'Presented a poster at the <a href="https://www.embl.de/training/events/2022/TRM22-01/" class="link">15th EMBL Conference: Transcription and Chromatin</a> about our new <a href="https://www.biorxiv.org/content/10.1101/2022.08.31.506061v1" class="link">preprint</a> on the flexibility of enhancer sequences and motif syntax (August 2022)'
  additional_text: ' Check out the poster <a href="/assets/others/deAlmeida_EMBL_TranscChromat2022.png" class="link">here</a>'

