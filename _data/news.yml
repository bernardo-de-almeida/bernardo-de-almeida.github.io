- date: "2025-12"
  text: 'We are excited to introduce Nucleotide Transformer v3 (NTv3) - InstaDeep''s new foundation model for long-range multi-species genomics 🎉'
  additional_text: ' <a href="https://www.biorxiv.org/content/10.64898/2025.12.22.695963v1" class="link">Preprint</a>, <a href="https://huggingface.co/spaces/InstaDeepAI/ntv3" class="link">HuggingFace Space</a>, <a href="https://x.com/deAlmeida_BP/status/2003464562670977234" class="link">Twitter thread</a>'
  images:
    - "/assets/images/NTv3.png"

- date: "2025-10"
  text: '"Annotating the genome at single-nucleotide resolution" accepted to <a href="https://www.nature.com/articles/s41592-025-02881-2" class="link">Nature Methods</a>'
  additional_text: ' <a href="https://instadeep.com/2025/10/genome-annotation-with-segmentnt/" class="link">Blog post</a>'

- date: "2025-06"
  text: 'We just open-sourced the first large-scale dataset designed to train conversational agents on biological sequences 🧬'
  additional_text: ' <a href="https://www.linkedin.com/posts/thomas-pierrot-120a43128_we-just-open-sourced-the-first-large-scale-activity-7346225275170414592-wajJ/" class="link">LinkedIn post</a>, <a href="https://www.nature.com/articles/s42256-025-01047-1" class="link">paper</a>, <a href="https://huggingface.co/datasets/InstaDeepAI/chatnt" class="link">Hugging Face dataset</a>'

- date: "2025-06"
  text: 'Our paper "A multimodal conversational agent for DNA, RNA and protein tasks" was featured on the cover of <a href="https://www.nature.com/articles/s42256-025-01047-1" class="link">Nature Machine Intelligence</a>!'
  additional_text: ' <a href="https://instadeep.com/2025/06/talking-biology-with-chatnt/" class="link">Blog post</a>'
