  text: 'Very happy to see our <a href="https://www.nature.com/articles/s41588-022-01048-5" class="link">DeepSTARR paper</a> highlighted in Nature Methods: "<a href="https://www.nature.com/articles/s41592-022-01557-5" class="link">Predicting and designing enhancers</a>" (July 2022)'

