- title: "Targeted design of synthetic enhancers for selected tissues in the Drosophila embryo"
  journal: "Nature"
  year: 2023
  url: "https://www.nature.com/articles/s41586-023-06905-9"
  description: "New publication showing a major breakthrough achievement – the de novo design of synthetic enhancers for selected tissues in fruit fly embryos in vivo using deep- and transfer learning."
  image: "/assets/images/nature2023.jpeg"
  press:
    - text: "Artificial Intelligence cracks code of gene regulation"
      url: "https://www.imp.ac.at/news/article/artificial-intelligence-cracks-code-of-gene-regulation"
    - text: "Twitter thread"
      url: "https://twitter.com/stark_lab/status/1734606276188057994"
  video: "https://www.youtube.com/embed/pKoEYeFvol4"

- title: "Enhancers display constrained sequence flexibility and context-specific modulation of motif function"
  journal: "Genome Research"
  year: 2023
  url: "https://genome.cshlp.org/content/33/3/346"
  description: "New publication where we study the flexibility of enhancer sequences and motif syntax using rationally designed libraries of enhancer variants and massively parallel reporter assays."
  image: "/assets/images/Enhancer_variants_paper.png"
  press:
    - text: "Decoding the grammar of gene regulation"
      url: "https://www.imp.ac.at/news/article/decoding-the-grammar-of-gene-regulation"

- title: "DeepSTARR predicts enhancer activity from DNA sequence and enables the <em>de novo</em> design of synthetic enhancers"
  journal: "Nature Genetics"
  year: 2022
  url: "https://www.nature.com/articles/s41588-022-01048-5"
  description: "New publication where we use deep learning to predict enhancer activity from DNA sequence, learn cis-regulatory rules and the importance of TF motif instances, and design synthetic enhancers."
  image: "/assets/images/DeepSTARR.png"
  featured_commentary:
    - author: "Lin Tang"
      text: "Predicting and designing enhancers"
      journal: "Nature Methods 2022"
      url: "https://www.nature.com/articles/s41592-022-01557-5"
  press:
    - text: "Awarded the Life Science Research Award Austria 2022, by ÖGMBT"
      url: "https://oegmbt.at/awards"
    - text: "Harnessing artificial intelligence to predict and control gene regulation"
      url: "https://www.imp.ac.at/news/article/harnessing-artificial-intelligence-to-predict-and-control-gene-regulation/"

- title: "Allosteric Antagonist Modulation of TRPV2 by Piperlongumine Impairs Glioblastoma Progression"
  journal: "ACS Cent. Sci."
  year: 2021
  url: "https://pubs.acs.org/doi/10.1021/acscentsci.1c00070"
  description: "It was great to contribute with computational analyses and be part of this big effort of <a href=\"https://gbernardeslab.com/\" class=\"link\">Gonçalo Bernardes</a> and <a href=\"https://moiseenkova-lab.com/\" class=\"link\">Vera Moiseenkova-Bell</a> teams. We computationally identify and experimentally validate TRPV2 as a target for piperlongumine and establish a link between allosteric target engagement and impaired GBM progression."
  images:
    - "/assets/images/Piperlongumine_cover.jpeg"
    - "/assets/images/Piperlongumine.jpeg"

