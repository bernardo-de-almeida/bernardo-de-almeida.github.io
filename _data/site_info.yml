name: "Bernardo Almeida"
title: "Head of Genomics AI Research at InstaDeep"
bio: "I am the Head of Genomics AI Research at <a href=\"https://www.instadeep.com/\" class=\"link\">InstaDeep</a>, where I am building large language foundational models for biology. My work focuses mostly on developing deep learning models that can <i>read the human genome</i> and <i>interpret its variation</i>.<br><br>My broader research interests include Deep Learning, Genomics and Personalized Medicine. I previously completed my PhD at the Research Institute of Molecular Pathology (<a href=\"https://www.imp.ac.at/groups/alexander-stark/\" class=\"link\">IMP</a>) in Vienna, working with <a href=\"https://starklab.org/\" class=\"link\">Alex Stark</a> on using deep learning and massively parallel reporter assays to decode the regulatory grammar of regulatory DNA sequences."
